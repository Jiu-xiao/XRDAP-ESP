name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 格式检查（clang-format 21.1.8，配置与 libxr 相同）
        run: |
          pip install clang-format==21.1.8
          git ls-files 'firmware/*.hpp' 'firmware/*.cpp' 'firmware/*.c' | xargs clang-format --dry-run --Werror

  # 纯逻辑（命令行、0x86、TCP 帧、USB/IP、状态灯输入）在电脑上的单元测试
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 单元测试
        run: |
          git submodule update --init third_party/xrdap-core
          cmake -S firmware/tests -B build-tests
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

  firmware:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32s3
            asset: xrdap-esp32-s3.bin
          # “高速无线 DAP 调试器 Lite”板：S3 工程加上 sdkconfig.defaults.lite
          - target: esp32s3
            asset: xrdap-esp32-s3-lite.bin
            board: lite
          - target: esp32c3
            asset: xrdap-esp32-c3.bin
          - target: esp32
            asset: xrdap-esp32.bin
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 编译
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'
          cd firmware/${{ matrix.target }}
          if [ -n "${{ matrix.board }}" ]; then
            idf.py -B build -D SDKCONFIG=build/sdkconfig \
              -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.${{ matrix.board }}" \
              build merge-bin
          else
            idf.py build merge-bin
          fi

      - name: 整理固件文件
        run: |
          mkdir out
          cp firmware/${{ matrix.target }}/build/merged-binary.bin out/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 整理发布文件
        run: |
          mkdir release
          cp artifacts/*.bin release/
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: 发布 release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
