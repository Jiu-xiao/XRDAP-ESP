name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  firmware:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32s3
            asset: xrdap-esp32-s3.bin
          - target: esp32c3
            asset: xrdap-esp32-c3.bin
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 编译
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'
          cd firmware/${{ matrix.target }}
          idf.py build merge-bin

      - name: 整理固件文件
        run: |
          mkdir out
          cp firmware/${{ matrix.target }}/build/merged-binary.bin out/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 整理发布文件
        run: |
          mkdir release
          cp artifacts/xrdap-esp32-s3.bin artifacts/xrdap-esp32-c3.bin release/
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: 发布 release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
