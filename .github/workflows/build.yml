name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  firmware:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: firmware
            target: esp32s3
            asset: xrdap-esp32-s3.bin
          - dir: ports/esp32c3-h2
            target: esp32c3
            asset: xrdap-esp32-c3.bin
          - dir: ports/esp32c3-h2
            target: esp32h2
            asset: xrdap-esp32-h2.bin
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 编译
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'
          cd ${{ matrix.dir }}
          idf.py -B build-${{ matrix.target }} -D IDF_TARGET=${{ matrix.target }}             -D SDKCONFIG=build-${{ matrix.target }}/sdkconfig build merge-bin

      - name: 整理固件文件
        run: |
          mkdir out
          cp ${{ matrix.dir }}/build-${{ matrix.target }}/merged-binary.bin out/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  forwarder:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: .exe
            suffix: windows-x86_64.exe
          - os: ubuntu-latest
            exe: ''
            suffix: linux-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      - name: 测试
        run: cargo test --release --workspace

      - name: 编译
        run: cargo build --release --workspace

      - name: 整理上位机程序
        run: |
          mkdir -p dist
          cp target/release/xrdap-forward${{ matrix.exe }} dist/xrdap-forward-${{ matrix.suffix }}
          cp target/release/xrdap${{ matrix.exe }} dist/xrdap-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: xrdap-forward-${{ matrix.suffix }}
          path: host/dist/xrdap-forward-${{ matrix.suffix }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: xrdap-${{ matrix.suffix }}
          path: host/dist/xrdap-${{ matrix.suffix }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, forwarder]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理发布文件
        run: |
          mkdir release
          cp artifacts/xrdap-esp32-s3.bin/xrdap-esp32-s3.bin release/
          cp artifacts/xrdap-esp32-c3.bin/xrdap-esp32-c3.bin release/
          cp artifacts/xrdap-esp32-h2.bin/xrdap-esp32-h2.bin release/
          cp artifacts/xrdap-forward-windows-x86_64.exe/xrdap-forward-windows-x86_64.exe release/
          cp artifacts/xrdap-forward-linux-x86_64/xrdap-forward-linux-x86_64 release/
          cp artifacts/xrdap-windows-x86_64.exe/xrdap-windows-x86_64.exe release/
          cp artifacts/xrdap-linux-x86_64/xrdap-linux-x86_64 release/
          chmod +x release/xrdap-forward-linux-x86_64 release/xrdap-linux-x86_64
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: 发布 release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
