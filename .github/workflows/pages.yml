name: pages

# 网页烧录站点：最新 release 的固件加上 main 上的页面，发布到 GitHub Pages（浏览器不能跨域
# 读 release 附件，固件要和页面放在同一站点）。打 v* 标签的 build 跑完、或 main 上 web/ 有
# 改动时重新发布。
on:
  workflow_run:
    workflows: [build]
    types: [completed]
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 取最新 release 的固件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p '*.bin' -D images
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: 生成网页烧录站点
        run: python3 web/make_site.py images "$RELEASE_TAG" site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
